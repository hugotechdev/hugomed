<!doctype html>
<html lang="sw">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HugoMed · Ingia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/hugomed.css">
</head>
<body>
  <main class="center-page">
    <div class="card status-card">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">H</div>
        <div>
          <div class="brand-name">HugoMed</div>
          <div class="muted small">Mfumo wa usimamizi wa hospitali · HUGO TECH</div>
        </div>
      </div>

      <h1>Ingia kwenye mfumo</h1>

      <form id="login-form" class="stack" novalidate>
        <label>Barua pepe
          <input type="email" name="email" autocomplete="username" required>
        </label>
        <label>Password
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <p id="login-message" class="form-message" role="alert"></p>
        <button type="submit" class="btn primary block">Ingia</button>
      </form>

      <p id="setup-link" class="muted small" hidden>
        Mfumo bado haujaandaliwa. <a href="setup.html">Unda Super Admin wa kwanza</a>
      </p>
      <p class="muted small"><a href="status.html">Hali ya mfumo</a></p>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script>
    // Kama tayari ameingia, mpeleke moja kwa moja kwenye mfumo
    if (HugoMed.getToken()) window.location.href = 'app.html';

    HugoMed.api('/api/auth/setup-status')
      .then((s) => { if (s.needs_setup) document.getElementById('setup-link').hidden = false; })
      .catch(() => {});

    const form = document.getElementById('login-form');
    const msg = document.getElementById('login-message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = HugoMed.formData(form);
      const btn = form.querySelector('button');
      btn.disabled = true;
      HugoMed.showMessage(msg, '');
      try {
        const res = await HugoMed.api('/api/auth/login', { method: 'POST', body: data, noRedirect: true });
        HugoMed.saveLogin(res.token, res.user);
        window.location.href = 'app.html';
      } catch (err) {
        HugoMed.showMessage(msg, err.message, 'error');
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
